<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ideark Studio, fábrica digital local para producir páginas web." />
    <title>Ideark Studio</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,520&family=Outfit:wght@340;460;560&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var raw = localStorage.getItem('ideark.studio.v1')
        var theme = raw && JSON.parse(raw).ui && JSON.parse(raw).ui.theme
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
